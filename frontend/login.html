<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecepAI — Intră în cont</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#09090B;--s1:#111214;--s2:#18191C;--b1:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);--tx:#F0F0F2;--t2:#8A8A94;--t3:#3E3E46;--teal:#00D4AA;--td:rgba(0,212,170,.08);--tm:rgba(0,212,170,.18);--red:#EF4444;--r:10px;}
html,body{height:100%;-webkit-font-smoothing:antialiased;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;min-height:100vh;}
nav{height:62px;display:flex;align-items:center;padding:0 max(20px,5vw);justify-content:space-between;border-bottom:1px solid var(--b1);}
.logo{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:var(--tx);text-decoration:none;letter-spacing:-.4px;}
.logo em{color:var(--teal);font-style:normal;}
.nav-link{font-size:13px;color:var(--t2);text-decoration:none;}
.nav-link span{color:var(--teal);font-weight:600;}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.box{width:100%;max-width:400px;}
.box-title{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.5px;margin-bottom:6px;}
.box-sub{font-size:14px;color:var(--t2);margin-bottom:28px;}
.err-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--red);font-size:13px;padding:11px 14px;border-radius:9px;margin-bottom:16px;display:none;}
.err-box.show{display:block;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--t3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.field input{width:100%;height:48px;background:var(--s1);border:1.5px solid var(--b1);border-radius:var(--r);padding:0 14px;font-size:14px;font-family:'Inter',sans-serif;color:var(--tx);outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,212,170,.08);}
.field input::placeholder{color:var(--t3);}
.field-footer{display:flex;justify-content:flex-end;margin-top:5px;}
.field-footer a{font-size:12px;color:var(--t2);text-decoration:none;transition:color .14s;}
.field-footer a:hover{color:var(--teal);}
.btn{width:100%;height:50px;background:var(--teal);color:#000;border:none;border-radius:var(--r);font-size:15px;font-weight:700;font-family:'Space Grotesk',sans-serif;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;}
.btn:hover{background:#00FFCC;}
.btn:disabled{opacity:.5;pointer-events:none;}
.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--t3);font-size:12px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--b1);}
.register-link{text-align:center;font-size:13px;color:var(--t2);}
.register-link a{color:var(--teal);text-decoration:none;font-weight:600;}
.register-link a:hover{text-decoration:underline;}
footer{padding:20px max(20px,5vw);border-top:1px solid var(--b1);display:flex;justify-content:center;}
footer p{font-size:12px;color:var(--t3);}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">Recep<em>AI</em></a>
  <a href="register.html" class="nav-link">Nu ai cont? <span>Înregistrează-te</span></a>
</nav>
<div class="main">
  <div class="box">
    <div class="box-title">Bun venit înapoi</div>
    <div class="box-sub">Intră în contul tău RecepAI</div>
    <div class="err-box" id="err-box"></div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="email@clinica.ro" autocomplete="email">
    </div>
    <div class="field">
      <label>Parolă</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <div class="field-footer"><a href="#">Ai uitat parola?</a></div>
    </div>
    <button class="btn" id="btn" onclick="doLogin()">
      <div class="spin" id="spin"></div>
      <span id="btn-txt">Intră în cont</span>
    </button>
    <div class="divider">sau</div>
    <div class="register-link">Nu ai cont? <a href="register.html">Testează gratuit 7 zile</a></div>
  </div>
</div>
<footer><p>© 2026 RecepAI · contact@receptieai.ro</p></footer>
<script>
const API = window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1'?'http://localhost:8080':'https://ai-reception-platform-production.up.railway.app';
if (localStorage.getItem('recepai_token')) window.location.href='dashboard.html';
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  const err = document.getElementById('err-box');
  err.classList.remove('show');
  if (!email || !pass) { err.textContent='Completează emailul și parola.'; err.classList.add('show'); return; }
  const btn = document.getElementById('btn');
  document.getElementById('spin').style.display='block';
  document.getElementById('btn-txt').textContent='Se conectează...';
  btn.disabled=true;
  try {
    const r = await fetch(`${API}/api/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});
    const d = await r.json();
    if (d.token) {
      localStorage.setItem('recepai_token',d.token);
      localStorage.setItem('recepai_email',d.email||email);
      localStorage.setItem('recepai_role',d.role||'owner');
      localStorage.setItem('recepai_client_id',d.clientId||'');
      localStorage.setItem('recepai_business',d.businessName||'');
      window.location.href = d.role==='admin' ? 'admin.html' : 'dashboard.html';
    } else {
      err.textContent = d.error||'Email sau parolă incorectă.';
      err.classList.add('show');
      btn.disabled=false;
      document.getElementById('spin').style.display='none';
      document.getElementById('btn-txt').textContent='Intră în cont';
    }
  } catch(e) {
    err.textContent='Nu ne putem conecta la server.';
    err.classList.add('show');
    btn.disabled=false;
    document.getElementById('spin').style.display='none';
    document.getElementById('btn-txt').textContent='Intră în cont';
  }
}
</script>
</body>
</html>
